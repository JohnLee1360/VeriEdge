{
  "experiment": {
    "model": "qwen",
    "runs_per_mode": 10,
    "seed": 7,
    "hash_modes": ["thc", "tstc"],
    "output_root": "artifacts/_shared/thc/output",
    "paper_img_dir": "paper/v2/img",
    "prompt_dataset": "artifacts/_shared/thc/data/qwen_prompt_splits_drift_search.jsonl",
    "default_split": "evaluation",
    "shard_plan": ["provider_a", "provider_b", "provider_c"],
    "shards": [
      {"name": "Shard 1", "provider": "provider_a", "start_layer": 0, "end_layer": 7, "checkpoint": "C1"},
      {"name": "Shard 2", "provider": "provider_b", "start_layer": 8, "end_layer": 15, "checkpoint": "C2"},
      {"name": "Shard 3", "provider": "provider_c", "start_layer": 16, "end_layer": 23, "checkpoint": "C3"}
    ],
    "decode_probe": {
      "strategy": "repeat_last_prompt_token",
      "fallback_token_id": 151643,
      "num_steps": 8
    }
  },
  "qwen": {
    "model_id": "~/.exo/models/mlx-community--Qwen3-0.6B-8bit",
    "hetero_model_id": "Qwen/Qwen3-0.6B",
    "hetero_hf_endpoint": "https://hf-mirror.com",
    "hetero_local_files_only": true,
    "hetero_trust_remote_code": false,
    "enable_mlx": true,
    "local_files_only": true,
    "download_if_missing": false,
    "hf_endpoint": "https://hf-mirror.com",
    "allow_mock_fallback": false,
    "use_mock_if_unavailable": false,
    "enable_torch_fallback": false,
    "mock_hidden_dim": 128
  },
  "determinism": {
    "hetero_levels": [
      {"name": "low", "noise_std": 0.000002, "fp16_cast": false},
      {"name": "mid", "noise_std": 0.000008, "fp16_cast": false},
      {"name": "high", "noise_std": 0.00002, "fp16_cast": true}
    ]
  },
  "tamper": {
    "checkpoint": "C2",
    "strength": 0.15
  },
  "calibration": {
    "percentile": 99.0
  },
  "tstc": {
    "seed_base": 2026,
    "delta_map": {
      "prefill": {"C1": 0.002, "C2": 0.002, "C3": 0.002},
      "decode": {"C1": 0.002, "C2": 0.002, "C3": 0.002}
    },
    "prefill": {
      "default": {"token_samples": 4, "channel_samples": 16},
      "grid": [
        {"token_samples": 2, "channel_samples": 8},
        {"token_samples": 2, "channel_samples": 16},
        {"token_samples": 3, "channel_samples": 16},
        {"token_samples": 4, "channel_samples": 16},
        {"token_samples": 4, "channel_samples": 24},
        {"token_samples": 4, "channel_samples": 32},
        {"token_samples": 8, "channel_samples": 16}
      ]
    },
    "decode": {
      "default": {"channel_samples": 32},
      "grid": [16, 32, 48, 64, 96, 128]
    }
  }
}

